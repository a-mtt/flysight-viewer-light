<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlySight Viewer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.30/dist/uPlot.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>FlySight Viewer</h1>
    <label class="button">
      Import track
      <input id="file" type="file" accept=".csv,text/csv" hidden>
    </label>
    <span id="filename"></span>
  </header>

  <p id="error" hidden></p>

  <section id="viewer" hidden>
    <div id="window">
      <label>From (s) <input id="from" type="number" step="0.1" min="0"></label>
      <label>To (s) <input id="to" type="number" step="0.1" min="0"></label>
      <button id="reset" type="button">Reset</button>
      <span class="hint">Drag across the chart to zoom.</span>
    </div>
    <div id="chart"></div>

    <h2>Scoring</h2>
    <div id="scoring-window">
      <label>Ground elevation (m above sea level) <input id="ground" type="number" step="1"></label>
      <label>Top (m) <input id="top" type="number" step="1" value="2500"></label>
      <label>Bottom (m) <input id="bottom" type="number" step="1" value="1500"></label>
      <span class="hint">Altitudes above ground.</span>
    </div>
    <p id="score-error" hidden></p>
    <dl id="score">
      <div><dt>Time in window</dt><dd id="score-time"></dd></div>
      <div><dt>Distance</dt><dd id="score-distance"></dd></div>
      <div><dt>Horizontal speed</dt><dd id="score-speed"></dd></div>
    </dl>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.30/dist/uPlot.iife.min.js"></script>
  <script src="parser.js"></script>
  <script src="scoring.js"></script>
  <script src="app.js"></script>
</body>
</html>
